name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- Quality Checks ---

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=$(jq -r '.version' manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "Version check passed: $MANIFEST"

      - name: Validate JSON files
        run: |
          echo "Checking manifest.json..."
          jq empty manifest.json

          ERRORS=0
          for f in _locales/*/messages.json; do
            echo "Checking $f..."
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error::Invalid JSON: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "All JSON files valid."

      - name: Check for empty translations
        run: |
          ERRORS=0
          for f in _locales/*/messages.json; do
            EMPTY=$(jq -r 'to_entries[] | select(.value.message == "") | .key' "$f")
            if [ -n "$EMPTY" ]; then
              echo "::error::$f has empty translations: $(echo $EMPTY | tr '\n' ', ')"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "No empty translations found."

      - name: Check i18n key consistency
        run: |
          REFERENCE="_locales/en/messages.json"
          REF_KEYS=$(jq -r 'keys[]' "$REFERENCE" | sort)
          ERRORS=0

          # Check all locale files have the same keys as English
          for f in _locales/*/messages.json; do
            [ "$f" = "$REFERENCE" ] && continue
            LANG_KEYS=$(jq -r 'keys[]' "$f" | sort)

            MISSING=$(comm -23 <(echo "$REF_KEYS") <(echo "$LANG_KEYS"))
            EXTRA=$(comm -13 <(echo "$REF_KEYS") <(echo "$LANG_KEYS"))

            if [ -n "$MISSING" ]; then
              echo "::error::$f is missing keys: $(echo $MISSING | tr '\n' ', ')"
              ERRORS=$((ERRORS + 1))
            fi
            if [ -n "$EXTRA" ]; then
              echo "::warning::$f has extra keys: $(echo $EXTRA | tr '\n' ', ')"
            fi
          done

          # Collect all i18n keys used in code
          JS_KEYS=$({ grep -rohP 'getMessage\(\s*"\K[^"]+' *.js api/*.js management/*.js insert-link/*.js save-attachments/*.js; grep -ohP '\bi\(\s*"\K[^"]+' background.js; } 2>/dev/null | sort -u)
          HTML_KEYS=$(grep -rohP 'data-i18n(?:-placeholder|-title|-empty)?="\K[^"]+' management/*.html insert-link/*.html save-attachments/*.html 2>/dev/null | sort -u)
          # manifest.json __MSG_key__ references
          MANIFEST_KEYS=$(grep -ohP '__MSG_\K[^_]+(?=__)' manifest.json | sort -u)
          CODE_KEYS=$(echo -e "${JS_KEYS}\n${HTML_KEYS}\n${MANIFEST_KEYS}" | sort -u)

          # Check for keys used in code but missing from en/messages.json
          MISSING_FROM_LOCALE=$(comm -23 <(echo "$CODE_KEYS") <(echo "$REF_KEYS"))
          if [ -n "$MISSING_FROM_LOCALE" ]; then
            echo "::error::Keys used in code but missing from locale files: $(echo $MISSING_FROM_LOCALE | tr '\n' ', ')"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for keys in en/messages.json but unused in code
          UNUSED=$(comm -13 <(echo "$CODE_KEYS") <(echo "$REF_KEYS"))
          if [ -n "$UNUSED" ]; then
            echo "::warning::Keys in locale files but unused in code: $(echo $UNUSED | tr '\n' ', ')"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "All locale files have consistent keys."

      - name: Verify manifest file references exist
        run: |
          ERRORS=0

          # Background scripts
          for f in $(jq -r '.background.scripts[]' manifest.json); do
            if [ ! -f "$f" ]; then
              echo "::error::Background script not found: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Management page
          MGMT=$(jq -r '.cloud_file.management_url' manifest.json)
          if [ ! -f "$MGMT" ]; then
            echo "::error::Management page not found: $MGMT"
            ERRORS=$((ERRORS + 1))
          fi

          # Popup pages
          for key in compose_action message_display_action; do
            POPUP=$(jq -r ".[\"$key\"].default_popup // empty" manifest.json)
            if [ -n "$POPUP" ] && [ ! -f "$POPUP" ]; then
              echo "::error::Popup not found: $POPUP"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Icons
          for icon in $(jq -r '.icons | values[]' manifest.json); do
            if [ ! -f "$icon" ]; then
              echo "::error::Icon not found: $icon"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "All manifest file references exist."

      - name: Verify no secrets in package
        run: |
          ERRORS=0
          for pattern in .env .env.* credentials* *.key *.pem; do
            # Check files that would be included in the xpi
            for f in $(find api/ management/ insert-link/ save-attachments/ icons/ _locales/ -name "$pattern" 2>/dev/null); do
              echo "::error::Potential secret file would be included: $f"
              ERRORS=$((ERRORS + 1))
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "No secrets detected."

      # --- Build & Upload ---

      - name: Build .xpi
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          zip -r "seafile-thunderbird-${VERSION}.xpi" \
            manifest.json background.js shared.js shared.css \
            api/ management/ insert-link/ save-attachments/ \
            icons/ _locales/ LICENSE PRIVACY.md

          echo "XPI_FILE=seafile-thunderbird-${VERSION}.xpi" >> "$GITHUB_ENV"
          echo "Built $XPI_FILE ($(du -h "seafile-thunderbird-${VERSION}.xpi" | cut -f1))"

      - name: Verify .xpi contents
        run: |
          ERRORS=0

          # Check for files that should NOT be in the xpi
          UNWANTED=$(zipinfo -1 "$XPI_FILE" | grep -E '^\.|\.xpi$|\.git|\.env|credentials|\.key$|\.pem$' || true)
          if [ -n "$UNWANTED" ]; then
            echo "::error::Unexpected files in .xpi: $(echo $UNWANTED | tr '\n' ', ')"
            ERRORS=$((ERRORS + 1))
          fi

          # Check that key files ARE in the xpi
          for f in manifest.json background.js shared.js shared.css api/seafile.js; do
            if ! zipinfo -1 "$XPI_FILE" | grep -q "^${f}$"; then
              echo "::error::Missing from .xpi: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "XPI contents verified."

      - name: Generate checksum
        run: |
          SHA256=$(sha256sum "$XPI_FILE" | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA256: $SHA256"

      - name: Create release and upload .xpi
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          # Upload .xpi
          gh release upload "$TAG" "$XPI_FILE" --clobber

          # Append checksum to release notes
          EXISTING=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "${EXISTING}

          ---
          **SHA256:** \`${SHA256}\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
