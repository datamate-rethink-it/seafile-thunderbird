<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    body {
      padding: 12px;
      width: 380px;
      min-height: 100px;
    }
    h3 {
      margin-bottom: 10px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      margin-bottom: 3px;
    }

    /* Path display (standalone, not folder-picker) */
    .current-path {
      font-size: var(--font-size-small);
      color: var(--color-text-secondary);
      background: var(--color-bg-input);
      padding: 5px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      word-break: break-all;
    }

    /* File browser */
    .file-browser {
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .file-browser #fileFilter {
      width: 100%;
      padding: 5px 8px 5px 28px;
      font-size: var(--font-size-base);
      border: none;
      border-bottom: 1px solid var(--color-border-light);
      border-radius: 0;
      background: var(--color-bg-surface) var(--search-icon) no-repeat 8px center;
      margin: 0;
    }
    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
    }
    .file-list:empty::after {
      content: attr(data-empty);
      display: block;
      padding: 12px;
      color: var(--color-text-disabled);
      font-size: var(--font-size-small);
      text-align: center;
    }
    .file-list li {
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--font-size-small);
      border-bottom: 1px solid var(--color-border-subtle);
    }
    .file-list li:last-child {
      border-bottom: none;
    }
    .file-list li:hover {
      background: var(--color-bg-highlight);
    }
    .file-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--color-text-icon);
      display: flex;
      align-items: center;
    }
    .file-icon svg {
      display: block;
    }
    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-size {
      flex-shrink: 0;
      color: var(--color-text-hint);
      font-size: var(--font-size-hint);
    }

    /* Buttons */
    button.primary {
      width: 100%;
    }
    .status {
      font-size: var(--font-size-small);
    }

    /* Input with button (password generator) */
    .input-with-btn {
      display: flex;
      gap: 0;
    }
    .input-with-btn input {
      flex: 1;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .input-with-btn .gen-btn {
      padding: 4px 8px;
      border: 1px solid var(--color-border);
      border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
      background: var(--color-bg-input);
      cursor: pointer;
      display: flex;
      align-items: center;
      color: var(--color-text-icon);
    }
    .input-with-btn .gen-btn:hover {
      background: var(--color-bg-button-hover);
      color: var(--color-text);
    }
    .input-with-btn .gen-btn svg {
      display: block;
    }

    /* Detail view */
    .detail-view {
      display: none;
    }
    .detail-view.active {
      display: block;
    }
    .selected-file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--color-bg-input);
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: var(--font-size-small);
    }
    .selected-file .file-name {
      font-weight: 600;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--color-primary);
      cursor: pointer;
      font-size: var(--font-size-small);
      margin-bottom: 10px;
    }
    .back-link:hover {
      text-decoration: underline;
    }

    /* Existing link warning */
    .existing-link-bar {
      display: none;
      padding: 8px;
      background: var(--color-info-bg);
      border: 1px solid var(--color-info-border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: var(--font-size-small);
      color: var(--color-info-text);
    }
    .existing-link-bar.visible {
      display: block;
    }
    .existing-link-bar .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .existing-link-bar button {
      font-size: var(--font-size-hint);
      padding: 4px 10px;
    }
  </style>
</head>
<body class="popup">
  <h3 data-i18n="insertSeafileLink">Insert Seafile Link</h3>

  <div id="accountSelector" class="form-group" style="display:none">
    <select id="accountSelect"></select>
  </div>

  <div id="loading" class="empty-msg" data-i18n="loading">Loading...</div>
  <div id="notConfigured" class="empty-msg" style="display:none" data-i18n="notConfigured">No Seafile account configured.</div>

  <!-- Browse view -->
  <div id="browseView" style="display:none">
    <div class="form-group">
      <label for="repoSelect" data-i18n="targetLibrary">Library</label>
      <select id="repoSelect"></select>
    </div>
    <label data-i18n="targetFolder">Target folder</label>
    <div class="current-path" id="currentPath">/</div>
    <div class="file-browser">
      <input type="text" id="fileFilter" style="display:none" data-i18n-placeholder="filterFiles" placeholder="Filter files by name...">
      <ul class="file-list" id="fileList" data-empty="Empty folder" data-i18n-empty="emptyFolder"></ul>
    </div>
  </div>

  <!-- Detail view (after file selection) -->
  <div id="detailView" class="detail-view">
    <div class="back-link" id="backBtn">&larr; <span data-i18n="backToFiles">Back</span></div>

    <div class="selected-file" id="selectedFile">
      <span class="file-icon" id="selectedFileIcon"></span>
      <span class="file-name" id="selectedFileName"></span>
      <span class="file-size" id="selectedFileSize"></span>
    </div>

    <div class="existing-link-bar" id="existingLinkBar">
      <span data-i18n="existingLinkFound">A share link already exists for this file.</span>
      <div class="btn-row">
        <button id="useExistingBtn" data-i18n="useExisting">Use existing</button>
        <button id="createNewBtn" data-i18n="createNew">Create new</button>
      </div>
    </div>

    <div id="linkOptions">
      <div class="form-group">
        <label for="linkPassword" data-i18n="sharePassword">Password Protection</label>
        <div class="input-with-btn">
          <input type="text" id="linkPassword" placeholder="">
          <button type="button" class="gen-btn" id="generatePasswordBtn" data-i18n-title="generatePassword" title="Generate password">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="11" width="20" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="17" r="1"/></svg>
          </button>
        </div>
        <span class="hint" data-i18n="sharePasswordHint">Leave empty for no password</span>
        <label id="showPasswordLabel" style="display:none;margin-top:6px;font-weight:normal;font-size:12px;cursor:pointer;align-items:center;gap:6px;">
          <input type="checkbox" id="showPasswordInEmail">
          <span data-i18n="showPasswordInEmail">Show password in email</span>
        </label>
      </div>
      <div class="form-group">
        <label for="linkExpireDays" data-i18n="shareExpireDays">Expiration (days)</label>
        <input type="number" id="linkExpireDays" min="0" placeholder="0">
        <span class="hint" data-i18n="shareExpireDaysHint">0 = no expiration</span>
      </div>
      <button id="insertBtn" class="primary" data-i18n="insertLink">Insert link into email</button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <script src="../icons/file-icons.js"></script>
  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
