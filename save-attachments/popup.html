<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    body {
      padding: 12px;
      width: 360px;
      min-height: 100px;
    }
    h3 {
      margin-bottom: 10px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      margin-bottom: 3px;
    }

    /* Attachment list */
    .attachment-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      max-height: 200px;
      overflow-y: auto;
    }
    .attachment-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--color-border-subtle);
      font-size: var(--font-size-small);
    }
    .attachment-list li:last-child {
      border-bottom: none;
    }
    .attachment-list input[type="checkbox"] {
      flex-shrink: 0;
    }
    .att-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: text;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 3px;
    }
    .att-name:hover {
      border-color: var(--color-border);
    }
    .att-name:focus {
      outline: none;
      border-color: var(--color-primary);
      background: var(--color-bg-surface);
    }
    .att-name.renamed {
      color: var(--color-primary);
    }
    .att-reset {
      display: none;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
      color: var(--color-text-hint);
    }
    .att-reset:hover {
      color: var(--color-primary);
    }
    .att-reset.visible {
      display: flex;
    }
    .att-size {
      flex-shrink: 0;
      color: var(--color-text-hint);
      font-size: var(--font-size-hint);
      margin-left: auto;
    }
    .att-status {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .att-status svg {
      display: block;
    }

    /* Folder breadcrumb */
    .folder-breadcrumb {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-bottom: 6px;
      font-size: var(--font-size-small);
      flex-wrap: wrap;
    }
    .folder-breadcrumb button {
      background: none;
      border: none;
      color: var(--color-primary);
      cursor: pointer;
      padding: 2px 4px;
      font-size: var(--font-size-small);
    }
    .folder-breadcrumb button:hover {
      text-decoration: underline;
      background: none;
    }
    .folder-breadcrumb span {
      color: var(--color-text-hint);
    }

    /* Folder picker: extra bottom margin in popup */
    .folder-picker {
      margin-bottom: 12px;
    }

    /* Buttons & status */
    button.primary {
      width: 100%;
    }
    .status {
      font-size: var(--font-size-small);
    }

    /* Select all */
    .select-all {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-small);
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body class="popup">
  <h3 data-i18n="saveToSeafile">Save to Seafile</h3>

  <div id="accountSelector" class="form-group" style="display:none">
    <select id="accountSelect"></select>
  </div>

  <div id="loading" class="empty-msg" data-i18n="loading">Loading...</div>
  <div id="noAttachments" class="empty-msg" style="display:none" data-i18n="noAttachments">No attachments found.</div>
  <div id="notConfigured" class="empty-msg" style="display:none" data-i18n="notConfigured">No Seafile account configured.</div>

  <div id="content" style="display:none">
    <div class="form-group">
      <label for="repoSelect" data-i18n="targetLibrary">Target Library</label>
      <select id="repoSelect"></select>
    </div>
    <label data-i18n="targetFolder">Target folder</label>
    <div class="folder-picker" id="folderPicker">
      <div class="current-path" id="currentPath"><span class="path-text">/</span><span class="toggle-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#999"/></svg></span></div>
      <ul class="folder-list" id="folderList" data-empty="No subfolders" data-i18n-empty="noSubfolders"></ul>
    </div>

    <div class="select-all">
      <input type="checkbox" id="selectAll" checked>
      <label for="selectAll" data-i18n="selectAll">Select all</label>
    </div>
    <ul class="attachment-list" id="attachmentList"></ul>

    <button id="saveBtn" class="primary" data-i18n="saveToSeafile">Save to Seafile</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <script src="../icons/file-icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
