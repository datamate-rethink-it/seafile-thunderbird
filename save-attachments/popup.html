<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared.css">
  <style>
    body {
      padding: 12px;
      width: 360px;
      min-height: 100px;
    }
    h3 {
      margin-bottom: 10px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      margin-bottom: 3px;
    }

    /* Attachment list */
    .attachment-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      max-height: 200px;
      overflow-y: auto;
    }
    .attachment-list li {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--color-border-subtle);
      font-size: var(--font-size-small);
    }
    .attachment-list li:last-child {
      border-bottom: none;
    }
    .attachment-list input[type="checkbox"] {
      flex-shrink: 0;
    }
    .att-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: text;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 3px;
    }
    .att-name:hover {
      border-color: var(--color-border);
    }
    .att-name:focus {
      outline: none;
      border-color: var(--color-primary);
      background: var(--color-bg-surface);
    }
    .att-name.renamed {
      color: var(--color-primary);
    }
    .att-reset {
      display: none;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
      color: var(--color-text-hint);
    }
    .att-reset:hover {
      color: var(--color-primary);
    }
    .att-reset.visible {
      display: flex;
    }
    .att-size {
      flex-shrink: 0;
      color: var(--color-text-hint);
      font-size: var(--font-size-hint);
      margin-left: auto;
    }
    .att-status {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .att-status svg {
      display: block;
    }
    .att-error {
      width: 100%;
      font-size: var(--font-size-hint);
      color: var(--color-error-text);
      padding: 2px 0 0 22px;
    }

    /* Folder breadcrumb */
    .folder-breadcrumb {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-bottom: 6px;
      font-size: var(--font-size-small);
      flex-wrap: wrap;
    }
    .folder-breadcrumb button {
      background: none;
      border: none;
      color: var(--color-primary);
      cursor: pointer;
      padding: 2px 4px;
      font-size: var(--font-size-small);
    }
    .folder-breadcrumb button:hover {
      text-decoration: underline;
      background: none;
    }
    .folder-breadcrumb span {
      color: var(--color-text-hint);
    }

    /* Folder path display */
    .current-path {
      font-size: var(--font-size-small);
      color: var(--color-text-secondary);
      background: var(--color-bg-input);
      padding: 5px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      word-break: break-all;
    }

    /* Folder browser box */
    .folder-browser {
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .folder-browser .folder-filter {
      width: 100%;
      padding: 5px 8px 5px 28px;
      font-size: var(--font-size-base);
      border: none;
      border-bottom: 1px solid var(--color-border-light);
      border-radius: 0;
      background: var(--color-bg-surface) var(--search-icon) no-repeat 8px center;
      margin: 0;
      box-sizing: border-box;
      outline: none;
      appearance: none;
    }
    .folder-browser .folder-filter:focus {
      box-shadow: none;
      border-bottom-color: var(--color-border-light);
    }
    .folder-browser .folder-list {
      list-style: none;
      padding: 0;
      margin: 0;
      height: 120px;
      overflow-y: auto;
      transition: opacity 0.1s ease;
    }
    .folder-browser .folder-list.loading {
      opacity: 0.3;
      pointer-events: none;
    }
    .folder-browser .folder-list li {
      padding: 4px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-small);
    }
    .folder-browser .folder-list li:hover {
      background: var(--color-bg-highlight);
    }

    /* Buttons & status */
    button.primary {
      width: 100%;
    }
    .status {
      font-size: var(--font-size-small);
    }

    /* Select all */
    .select-all {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-small);
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body class="popup">
  <h3 data-i18n="saveToSeafile">Save to Seafile</h3>

  <div id="accountSelector" class="form-group" style="display:none">
    <select id="accountSelect"></select>
  </div>

  <div id="loading" class="empty-msg" data-i18n="loading">Loading...</div>
  <div id="noAttachments" class="empty-msg" style="display:none" data-i18n="noAttachments">No attachments found.</div>
  <div id="notConfigured" class="empty-msg" style="display:none" data-i18n="notConfigured">No Seafile account configured.</div>

  <div id="content" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <label for="repoSelect" data-i18n="targetLibrary">Target Library</label>
      <a href="#" id="resetDefaults" style="display:none;font-size:var(--font-size-hint);color:var(--color-text-hint);" data-i18n="resetToDefaults">Reset to defaults</a>
    </div>
    <div class="form-group" style="margin-top:0">
      <select id="repoSelect"></select>
    </div>
    <label data-i18n="targetFolder">Target folder</label>
    <div class="current-path" id="currentPath"><span class="path-text">/</span></div>
    <div class="folder-browser" id="folderPicker">
      <input type="text" id="folderFilter" class="folder-filter" data-i18n-placeholder="filterFiles" placeholder="Filter by name...">
      <ul class="folder-list" id="folderList" data-empty="No subfolders" data-i18n-empty="noSubfolders"></ul>
    </div>

    <div class="select-all">
      <input type="checkbox" id="selectAll" checked>
      <label for="selectAll" data-i18n="selectAll">Select all</label>
    </div>
    <ul class="attachment-list" id="attachmentList"></ul>

    <button id="saveBtn" class="primary" data-i18n="saveToSeafile">Save to Seafile</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <script src="../icons/file-icons.js"></script>
  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
